name: Check HTTP container
description: Probe HTTP startup and scan the image and its optional CycloneDX SBOM.

inputs:
  image:
    description: Local tag or pulled registry digest to probe and scan.
    required: true
  container-port:
    description: HTTP port inside the container.
    required: true
  http-method:
    description: Uppercase HTTP method used for the readiness probe.
    default: GET
  http-path:
    description: Loopback HTTP request path.
    default: '/'
  http-status:
    description: Comma-separated accepted HTTP status codes or classes such as 2xx.
    default: '2xx,3xx'
  http-attempts:
    description: Maximum number of startup probe attempts, from 1 to 30.
    default: '20'
  container-user:
    description: Optional Docker user or UID with an optional group. Defaults to the image user.
    default: ''
  container-env:
    description: Optional container environment variables, one NAME=VALUE per line.
    default: ''
  cyclonedx-path:
    description: Optional absolute path to a CycloneDX JSON SBOM inside the container.
    default: ''
  block-on-fixable:
    description: Fail on High or Critical findings with a fix available.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Probe HTTP startup and collect the optional SBOM
      id: smoke
      env:
        IMAGE: ${{ inputs.image }}
        CONTAINER_PORT: ${{ inputs.container-port }}
        HTTP_METHOD: ${{ inputs.http-method }}
        HTTP_PATH: ${{ inputs.http-path }}
        HTTP_STATUS: ${{ inputs.http-status }}
        HTTP_ATTEMPTS: ${{ inputs.http-attempts }}
        CONTAINER_USER: ${{ inputs.container-user }}
        CONTAINER_ENV: ${{ inputs.container-env }}
        CYCLONEDX_PATH: ${{ inputs.cyclonedx-path }}
      shell: bash
      run: |
        if [[ ! "$CONTAINER_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( CONTAINER_PORT > 65535 )); then
          echo '::error::container-port must be an integer from 1 to 65535.'
          exit 1
        fi
        if [[ ! "$HTTP_ATTEMPTS" =~ ^[1-9][0-9]?$ ]] || (( HTTP_ATTEMPTS > 30 )); then
          echo '::error::http-attempts must be an integer from 1 to 30.'
          exit 1
        fi
        if [[ ! "$HTTP_METHOD" =~ ^[A-Z][A-Z0-9_-]*$ ]]; then
          echo '::error::http-method must be an uppercase HTTP method.'
          exit 1
        fi
        if [[ "$HTTP_PATH" != /* || ( -n "$CYCLONEDX_PATH" && "$CYCLONEDX_PATH" != /* ) ]]; then
          echo '::error::http-path and any cyclonedx-path must start with /.'
          exit 1
        fi
        status_pattern='[1-5]([0-9]{2}|xx)'
        if [[ ! "$HTTP_STATUS" =~ ^$status_pattern(,$status_pattern)*$ ]]; then
          echo '::error::http-status must list HTTP status codes or classes separated by commas.'
          exit 1
        fi
        IFS=, read -r -a expected_status <<< "$HTTP_STATUS"

        args=(--detach --pull=never --publish "127.0.0.1::${CONTAINER_PORT}")
        if [[ -n "$CONTAINER_USER" ]]; then
          args+=(--user "$CONTAINER_USER")
        fi
        while IFS= read -r entry; do
          if [[ -z "$entry" ]]; then
            continue
          fi
          if [[ "$entry" != ?*=* ]]; then
            echo '::error::Each container-env entry must use NAME=VALUE.'
            exit 1
          fi
          args+=(--env "$entry")
        done <<< "$CONTAINER_ENV"

        container="$(docker run "${args[@]}" -- "$IMAGE")"
        cleanup() {
          local result=$?
          if (( result != 0 )); then
            docker inspect --format '{{json .State}}' "$container" >&2 || true
            docker logs "$container" >&2 || true
          fi
          docker rm -f "$container" >/dev/null || true
        }
        trap cleanup EXIT

        url="http://$(docker port "$container" "${CONTAINER_PORT}/tcp")${HTTP_PATH}"
        method=(--request "$HTTP_METHOD")
        if [[ "$HTTP_METHOD" == HEAD ]]; then
          method=(--head)
        fi
        for (( attempt=1; attempt <= HTTP_ATTEMPTS; attempt++ )); do
          status="$(curl --silent --globoff --noproxy '*' --connect-timeout 1 --max-time 3 \
            "${method[@]}" --output /dev/null --write-out '%{http_code}' "$url")" || status=000
          for expected in "${expected_status[@]}"; do
            if [[ "$status" == "$expected" || "${status:0:1}xx" == "$expected" ]]; then
              echo "Container responded with HTTP $status."
              break 2
            fi
          done
          if (( attempt == HTTP_ATTEMPTS )) || [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]]; then
            echo "::error::Container readiness check failed after $attempt attempt(s), last HTTP status $status."
            exit 1
          fi
          sleep 1
        done

        if [[ -n "$CYCLONEDX_PATH" ]]; then
          sbom_dir="$(mktemp -d "$RUNNER_TEMP/container-sbom.XXXXXX")"
          sbom="$sbom_dir/sbom.json"
          if copy_error="$(docker cp "$container:$CYCLONEDX_PATH" "$sbom" 2>&1)"; then
            if [[ ! -f "$sbom" || -L "$sbom" ]] || ! jq -e \
              '.bomFormat == "CycloneDX" and (.components | type == "array" and length > 0)' "$sbom" >/dev/null; then
              echo '::error::Expected a CycloneDX JSON SBOM with components.'
              exit 1
            fi
            echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
          elif [[ "$copy_error" == *"Could not find the file $CYCLONEDX_PATH in container $container"* ]]; then
            echo "No CycloneDX SBOM at $CYCLONEDX_PATH in this release image."
          else
            printf '%s\n' "$copy_error" >&2
            exit 1
          fi
        fi

    - name: Scan image for known vulnerabilities
      id: image-scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: ${{ inputs.image }}
        output-format: json
        fail-build: false
        by-cve: true

    - name: Scan dependencies from the image SBOM
      id: sbom-scan
      if: steps.smoke.outputs.sbom != ''
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        sbom: ${{ steps.smoke.outputs.sbom }}
        output-format: json
        fail-build: false
        by-cve: true

    - name: Summarize findings and apply release policy
      env:
        IMAGE_SCAN: ${{ steps.image-scan.outputs.json }}
        SBOM: ${{ steps.smoke.outputs.sbom }}
        SBOM_SCAN: ${{ steps.sbom-scan.outputs.json }}
        BLOCK_ON_FIXABLE: ${{ inputs.block-on-fixable }}
      shell: bash
      run: |
        scans=("$IMAGE_SCAN")
        if [[ -n "$SBOM" ]]; then
          scans+=("$SBOM_SCAN")
        fi
        for result in "${scans[@]}"; do
          jq -e '.matches | type == "array"' "$result" >/dev/null
        done
        findings="$(jq --slurp '
          [.[].matches[] | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")]
          | unique_by(.vulnerability.id, .artifact.type, .artifact.name, .artifact.version, .vulnerability.namespace, .vulnerability.fix.state)
        ' "${scans[@]}")"
        fixable="$(jq '[.[] | select(.vulnerability.fix.state == "fixed")] | length' <<< "$findings")"
        {
          echo '### High and Critical vulnerabilities'
          echo
          echo '| Advisory | Package | Installed | Source | Severity | Fixed versions |'
          echo '| --- | --- | --- | --- | --- | --- |'
          jq -r '.[] | "| \(.vulnerability.id) | \(.artifact.name) | \(.artifact.version) | \(.artifact.type) | \(.vulnerability.severity) | \((.vulnerability.fix.versions // []) | join(", ")) |"' <<< "$findings"
          echo
          echo "Findings with a fix available: $fixable"
        } >> "$GITHUB_STEP_SUMMARY"
        if [[ "$BLOCK_ON_FIXABLE" == 'true' && "$fixable" -gt 0 ]]; then
          echo '::error::Fixable High or Critical vulnerabilities block publication. See the job summary.'
          exit 1
        fi
